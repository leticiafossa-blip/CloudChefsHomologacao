<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha? · Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="tela-login">
        <div class="caixa-login">
            <img src="img/logo.png" alt="Logo Cloud Chefs">
            <h1>Esqueceu a senha?</h1>
            <p>
                Por segurança, a senha é redefinida pelo <strong>gerente</strong> da loja.
                Peça para ele abrir <em>Colaboradores</em>, escolher o seu usuário e clicar em
                <strong>Nova senha</strong>.
            </p>
            <a href="login.html" class="btn btn-primario btn-bloco"><i class="fa-solid fa-arrow-left"></i> Voltar ao login</a>
        </div>
    </div>
</body>
</html>
