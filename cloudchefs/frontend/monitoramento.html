<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <div>
                <h2>Fila de produção</h2>
                <p>Atualiza sozinha a cada 10 segundos.</p>
            </div>
            <a href="pedidos.html" class="btn btn-primario"><i class="fa-solid fa-plus"></i> Novo pedido</a>
        </div>

        <div class="kpis">
            <div class="kpi destaque"><div class="rotulo">Na fila agora</div><div class="valor" id="kpi-fila">–</div></div>
            <div class="kpi"><div class="rotulo">Pedidos hoje</div><div class="valor" id="kpi-pedidos">–</div></div>
            <div class="kpi" id="kpi-faturamento-box"><div class="rotulo">Faturamento hoje</div><div class="valor" id="kpi-faturamento">–</div></div>
            <div class="kpi"><div class="rotulo">Itens com estoque baixo</div><div class="valor" id="kpi-estoque">–</div></div>
        </div>

        <div class="grade-fila">
            <section class="cartao">
                <h3><i class="fa-solid fa-fire-burner"></i> Pedidos em preparo</h3>
                <div id="fila"><div class="carregando">Carregando pedidos...</div></div>
            </section>

            <aside class="cartao">
                <h3><i class="fa-solid fa-boxes-stacked"></i> Nível de estoque</h3>
                <div id="estoque"><div class="carregando">Carregando estoque...</div></div>
            </aside>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let usuario;

        function minutosDesde(texto) {
            const d = paraData(texto);
            if (!d) return '';
            const min = Math.max(0, Math.round((Date.now() - d) / 60000));
            return min < 1 ? 'agora' : min < 60 ? `há ${min} min` : `há ${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;
        }

        function cartaoPedido(p) {
            const pronto = p.status === 'Pronto';
            const itens = p.itens.map(i => `<li><span>${iconeProduto(i.categoria)}</span><span><b>${i.quantidade}x</b> ${esc(i.nome_produto)}</span></li>`).join('');
            const acao = pronto
                ? `<button class="btn btn-sucesso btn-pequeno" onclick="mudarStatus(${p.id_pedido}, 'Concluído', this)"><i class="fa-solid fa-check"></i> Entregue</button>`
                : `<button class="btn btn-amarelo btn-pequeno" onclick="mudarStatus(${p.id_pedido}, 'Pronto', this)"><i class="fa-solid fa-bell-concierge"></i> Pronto</button>`;
            const cancelar = usuario.tipo_usuario === 'GERENTE'
                ? `<button class="btn btn-perigo btn-pequeno" title="Cancelar pedido" onclick="cancelar(${p.id_pedido}, this)"><i class="fa-solid fa-xmark"></i></button>`
                : '';
            return `
                <article class="pedido-card ${pronto ? 'pronto' : ''}">
                    <header>
                        <div>
                            <div class="numero">${numeroPedido(p.id_pedido)}</div>
                            <div class="cliente">${esc(p.nome_cliente)}</div>
                        </div>
                        <span class="badge ${pronto ? 'badge-ok' : 'badge-alerta'}">${pronto ? 'Pronto' : 'Preparando'}</span>
                    </header>
                    <ul>${itens}</ul>
                    <footer>
                        <span class="tempo"><i class="fa-regular fa-clock"></i> ${hora(p.data_pedido)} · ${minutosDesde(p.data_pedido)}</span>
                        <div class="acoes">${cancelar}${acao}</div>
                    </footer>
                </article>`;
        }

        async function carregarFila() {
            const caixa = document.getElementById('fila');
            try {
                const { pedidos, hoje } = await api('pedidos.php');
                document.getElementById('kpi-fila').textContent = pedidos.length;
                document.getElementById('kpi-pedidos').textContent = hoje.pedidos;
                document.getElementById('kpi-faturamento').textContent = moeda(hoje.faturamento);
                caixa.innerHTML = pedidos.length
                    ? `<div class="lista-pedidos">${pedidos.map(cartaoPedido).join('')}</div>`
                    : '<p class="suave" style="text-align:center;padding:24px">Nenhum pedido na fila no momento.</p>';
            } catch (e) {
                caixa.innerHTML = `<p class="suave">Não foi possível carregar: ${esc(e.message)}</p>`;
            }
        }

        async function carregarEstoque() {
            const caixa = document.getElementById('estoque');
            try {
                const { itens } = await api('estoque.php');
                const nivel = i => i.quantidade_minima > 0 ? i.quantidade_atual / i.quantidade_minima : 99;
                itens.sort((a, b) => nivel(a) - nivel(b));
                let baixos = 0;
                caixa.innerHTML = itens.map(i => {
                    const n = nivel(i);
                    const classe = n <= 1 ? 'baixo' : n <= 2 ? 'medio' : '';
                    if (n <= 1) baixos++;
                    const largura = Math.min(100, Math.max(3, n / 4 * 100));
                    return `
                        <div class="item-estoque">
                            <div class="linha"><span>${esc(i.nome_item)}</span><b>${numeroBR(i.quantidade_atual)} ${esc(i.unidade_medida)}</b></div>
                            <div class="barra"><div class="${classe}" style="width:${largura}%"></div></div>
                        </div>`;
                }).join('') || '<p class="suave">Nenhum item cadastrado.</p>';
                document.getElementById('kpi-estoque').textContent = baixos;
            } catch (e) {
                caixa.innerHTML = `<p class="suave">Não foi possível carregar: ${esc(e.message)}</p>`;
            }
        }

        async function mudarStatus(id, status, botao) {
            await comBotao(botao, async () => {
                try {
                    await api('pedidos.php', { metodo: 'PATCH', dados: { id_pedido: id, status } });
                    exibirMensagem(status === 'Pronto' ? `Pedido ${numeroPedido(id)} está pronto!` : `Pedido ${numeroPedido(id)} entregue.`, 'sucesso');
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
            carregarFila();
        }

        async function cancelar(id, botao) {
            if (!confirm(`Cancelar o pedido ${numeroPedido(id)}? Os ingredientes voltam para o estoque.`)) return;
            await comBotao(botao, async () => {
                try {
                    await api('pedidos.php', { metodo: 'PATCH', dados: { id_pedido: id, status: 'Cancelado' } });
                    exibirMensagem(`Pedido ${numeroPedido(id)} cancelado.`, 'alerta');
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
            carregarFila();
            carregarEstoque();
        }

        async function atualizar() {
            await Promise.all([carregarFila(), carregarEstoque()]);
        }

        iniciarPagina({ id: 'monitoramento', titulo: 'Fila de produção' }).then(u => {
            usuario = u;
            if (u.tipo_usuario !== 'GERENTE') document.getElementById('kpi-faturamento-box').classList.add('oculto');
            atualizar();
            setInterval(() => { if (!document.hidden) atualizar(); }, 10000);
        }).catch(() => {});
    </script>
</body>
</html>
