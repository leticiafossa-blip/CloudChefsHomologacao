<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <div>
                <h2 id="titulo">Novo produto</h2>
                <p>A receita define quanto de cada ingrediente sai do estoque a cada venda.</p>
            </div>
            <a href="produtos.html" class="btn btn-secundario"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        </div>

        <form id="form-produto" class="grade-2" novalidate>
            <section class="cartao">
                <h3>Dados do produto</h3>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" maxlength="120" required placeholder="Ex.: X-Salada">
                </div>
                <div class="linha-campos">
                    <div class="campo">
                        <label for="preco">Preço de venda (R$)</label>
                        <input type="number" id="preco" min="0.01" step="0.01" required placeholder="0,00">
                    </div>
                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="lanche">Lanche</option>
                            <option value="acompanhamento">Acompanhamento</option>
                            <option value="bebida">Bebida</option>
                        </select>
                    </div>
                </div>
                <div class="campo">
                    <label for="imagem">Imagem</label>
                    <select id="imagem"></select>
                    <small>Imagens disponíveis na pasta <code>frontend/img</code>.</small>
                </div>
                <div class="campo oculto" id="campo-status">
                    <label for="status">Situação</label>
                    <select id="status">
                        <option value="1">Ativo (aparece no cardápio)</option>
                        <option value="0">Inativo (escondido)</option>
                    </select>
                </div>
            </section>

            <section class="cartao">
                <h3>Receita (baixa de estoque)</h3>
                <div id="ingredientes"></div>
                <button type="button" class="btn btn-secundario btn-pequeno" onclick="adicionarIngrediente()">
                    <i class="fa-solid fa-plus"></i> Adicionar ingrediente
                </button>
                <hr style="border:none;border-top:1px solid var(--borda);margin:20px 0">
                <button type="submit" class="btn btn-primario btn-bloco" id="btn-salvar"><i class="fa-solid fa-floppy-disk"></i> Salvar produto</button>
            </section>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        const IMAGENS = ['hambuguer1.png', 'hamburguer2.png', 'bigmac.png', 'duploquarterao.png', 'duploburguercomqueijo.png',
            'duploburguerbacon.png', 'mcchickenduplo.png', 'cheeseburguer.png', 'mccchickenbacon.png',
            'batatap.png', 'batatam.png', 'batatag.png', 'cocacola.png', 'guarana.png', 'fantalaranja.png'];
        const idProduto = new URLSearchParams(location.search).get('id');
        let estoque = [];

        function adicionarIngrediente(idItem = '', quantidade = '') {
            const linha = document.createElement('div');
            linha.className = 'ingrediente';
            linha.innerHTML = `
                <select class="entrada ing-item" aria-label="Ingrediente">
                    <option value="">Selecione...</option>
                    ${estoque.map(i => `<option value="${i.id_item}" ${i.id_item == idItem ? 'selected' : ''}>${esc(i.nome_item)} (${esc(i.unidade_medida)})</option>`).join('')}
                </select>
                <input type="number" class="entrada ing-qtd" min="0.001" step="0.001" placeholder="Qtd." value="${esc(quantidade)}" aria-label="Quantidade">
                <button type="button" class="btn btn-perigo btn-pequeno" title="Remover" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>`;
            document.getElementById('ingredientes').appendChild(linha);
        }

        async function salvar(evento) {
            evento.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value.trim(),
                preco: document.getElementById('preco').value,
                categoria: document.getElementById('categoria').value,
                imagem: document.getElementById('imagem').value || null,
                status: document.getElementById('status').value === '1',
                ingredientes: [...document.querySelectorAll('.ingrediente')]
                    .map(l => ({ id_item: l.querySelector('.ing-item').value, quantidade: l.querySelector('.ing-qtd').value }))
                    .filter(i => i.id_item && i.quantidade),
            };
            if (!dados.nome || !(Number(dados.preco) > 0)) {
                exibirMensagem('Preencha o nome e um preço maior que zero.', 'alerta');
                return;
            }
            if (idProduto) dados.id_produto = idProduto;

            await comBotao(document.getElementById('btn-salvar'), async () => {
                try {
                    await api('produtos.php', { metodo: idProduto ? 'PUT' : 'POST', dados });
                    exibirMensagem('Produto salvo!', 'sucesso');
                    setTimeout(() => location.href = 'produtos.html', 800);
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
        }

        iniciarPagina({ id: 'produtos', titulo: 'Produtos', somenteGerente: true }).then(async () => {
            document.getElementById('imagem').innerHTML = '<option value="">Sem imagem (usa um ícone)</option>' +
                IMAGENS.map(i => `<option value="img/${i}">${i}</option>`).join('');
            estoque = (await api('estoque.php')).itens;

            if (idProduto) {
                const { produto } = await api(`produtos.php?id=${encodeURIComponent(idProduto)}`);
                document.getElementById('titulo').textContent = `Editar: ${produto.nome}`;
                document.getElementById('nome').value = produto.nome;
                document.getElementById('preco').value = produto.preco.toFixed(2);
                document.getElementById('categoria').value = produto.categoria;
                document.getElementById('status').value = produto.status ? '1' : '0';
                document.getElementById('campo-status').classList.remove('oculto');
                const imagem = document.getElementById('imagem');
                if (produto.imagem && ![...imagem.options].some(o => o.value === produto.imagem)) {
                    imagem.add(new Option(produto.imagem, produto.imagem));
                }
                imagem.value = produto.imagem || '';
                produto.ingredientes.forEach(i => adicionarIngrediente(i.id_item, i.quantidade));
            }
            if (!document.querySelector('.ingrediente')) adicionarIngrediente();
            document.getElementById('form-produto').addEventListener('submit', salvar);
        }).catch(e => { if (e.message !== 'Sessão expirada.') exibirMensagem(e.message, 'erro'); });
    </script>
</body>
</html>
