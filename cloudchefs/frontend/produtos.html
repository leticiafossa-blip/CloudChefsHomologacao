<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <div>
                <h2>Produtos do cardápio</h2>
                <p>Produtos inativos não aparecem na tela de novo pedido.</p>
            </div>
            <a href="produto.html" class="btn btn-primario"><i class="fa-solid fa-plus"></i> Novo produto</a>
        </div>

        <section class="cartao">
            <div class="tabela-container">
                <table class="tabela">
                    <thead>
                        <tr><th></th><th>Produto</th><th>Categoria</th><th class="num">Preço</th><th>Situação</th><th></th></tr>
                    </thead>
                    <tbody id="lista"><tr><td colspan="6" class="carregando">Carregando...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        const NOMES_CATEGORIA = { lanche: 'Lanche', acompanhamento: 'Acompanhamento', bebida: 'Bebida' };

        async function carregar() {
            const corpo = document.getElementById('lista');
            try {
                const { produtos } = await api('produtos.php?todos=1');
                corpo.innerHTML = produtos.map(p => `
                    <tr>
                        <td style="width:60px">${p.imagem ? `<img class="miniatura" src="${esc(p.imagem)}" alt="">` : `<span style="font-size:28px">${iconeProduto(p.categoria)}</span>`}</td>
                        <td><b>${esc(p.nome)}</b></td>
                        <td>${NOMES_CATEGORIA[p.categoria] || esc(p.categoria)}</td>
                        <td class="num">${moeda(p.preco)}</td>
                        <td><span class="badge ${p.status ? 'badge-ok' : 'badge-neutro'}">${p.status ? 'No cardápio' : 'Inativo'}</span></td>
                        <td class="num"><a class="btn btn-secundario btn-pequeno" href="produto.html?id=${p.id_produto}"><i class="fa-solid fa-pen"></i> Editar</a></td>
                    </tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum produto cadastrado.</td></tr>';
            } catch (e) {
                corpo.innerHTML = `<tr><td colspan="6" class="vazio">${esc(e.message)}</td></tr>`;
            }
        }

        iniciarPagina({ id: 'produtos', titulo: 'Produtos', somenteGerente: true }).then(carregar).catch(() => {});
    </script>
</body>
</html>
