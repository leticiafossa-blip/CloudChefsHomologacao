<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="passos" id="passos">
            <span class="passo ativo" data-passo="1"><b>1</b> Cliente</span>
            <span class="passo" data-passo="2"><b>2</b> Itens</span>
            <span class="passo" data-passo="3"><b>3</b> Pagamento</span>
        </div>

        <!-- Etapa 1: cliente -->
        <section class="cartao etapa" id="etapa-1" style="max-width:520px">
            <h3>Para quem é o pedido?</h3>
            <form id="form-cliente">
                <div class="campo">
                    <label for="nome-cliente">Nome do cliente</label>
                    <input type="text" id="nome-cliente" maxlength="120" placeholder="Ex.: Maria da Silva" autocomplete="off">
                </div>
                <div class="acoes">
                    <button type="submit" class="btn btn-primario">Continuar <i class="fa-solid fa-arrow-right"></i></button>
                    <a href="monitoramento.html" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </section>

        <!-- Etapa 2: cardápio -->
        <section class="etapa oculto" id="etapa-2">
            <div class="grade-pedido">
                <div>
                    <div class="abas" id="abas">
                        <button class="aba ativa" data-categoria="lanche">🍔 Lanches</button>
                        <button class="aba" data-categoria="acompanhamento">🍟 Acompanhamentos</button>
                        <button class="aba" data-categoria="bebida">🥤 Bebidas</button>
                    </div>
                    <div class="cardapio" id="cardapio"><div class="carregando">Carregando cardápio...</div></div>
                </div>

                <aside class="cartao resumo">
                    <h3>Pedido de <span id="cliente-resumo"></span></h3>
                    <ul id="itens-resumo"></ul>
                    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
                    <div class="acoes">
                        <button class="btn btn-secundario" onclick="irPara(1)"><i class="fa-solid fa-arrow-left"></i></button>
                        <button class="btn btn-primario" style="flex:1" id="btn-ir-pagamento" onclick="irPara(3)" disabled>Ir para pagamento</button>
                    </div>
                </aside>
            </div>
        </section>

        <!-- Etapa 3: pagamento -->
        <section class="cartao etapa oculto" id="etapa-3" style="max-width:720px">
            <h3>Como o cliente vai pagar?</h3>
            <p class="suave" style="margin-top:-6px">Pedido de <b id="cliente-pagamento"></b> · total <b id="total-pagamento"></b></p>
            <div class="formas" id="formas">
                <button class="forma" data-forma="Dinheiro"><i class="fa-solid fa-money-bill-wave"></i> Dinheiro</button>
                <button class="forma" data-forma="Debito"><i class="fa-regular fa-credit-card"></i> Débito</button>
                <button class="forma" data-forma="Credito"><i class="fa-solid fa-credit-card"></i> Crédito</button>
                <button class="forma" data-forma="PIX"><i class="fa-solid fa-qrcode"></i> Pix</button>
            </div>
            <div class="acoes">
                <button class="btn btn-secundario" onclick="irPara(2)"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
                <button class="btn btn-sucesso btn-grande" id="btn-finalizar" disabled onclick="finalizar(this)">
                    <i class="fa-solid fa-check"></i> Finalizar pedido
                </button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        let produtos = [];
        const carrinho = {};          // id_produto -> quantidade
        let categoria = 'lanche';
        let formaPagamento = null;
        let consultaPix = null;

        const nomeCliente = () => document.getElementById('nome-cliente').value.trim() || 'Consumidor';

        function totalCarrinho() {
            return Object.entries(carrinho).reduce((soma, [id, qtd]) =>
                soma + qtd * (produtos.find(p => p.id_produto == id)?.preco || 0), 0);
        }

        function irPara(etapa) {
            if (etapa === 3 && totalCarrinho() === 0) return;
            document.querySelectorAll('.etapa').forEach(e => e.classList.add('oculto'));
            document.getElementById(`etapa-${etapa}`).classList.remove('oculto');
            document.querySelectorAll('.passo').forEach(p => {
                const n = Number(p.dataset.passo);
                p.className = 'passo' + (n === etapa ? ' ativo' : n < etapa ? ' feito' : '');
            });
            document.getElementById('cliente-resumo').textContent = nomeCliente();
            document.getElementById('cliente-pagamento').textContent = nomeCliente();
            document.getElementById('total-pagamento').textContent = moeda(totalCarrinho());
            if (etapa === 1) document.getElementById('nome-cliente').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function desenharCardapio() {
            const lista = produtos.filter(p => p.categoria === categoria);
            document.getElementById('cardapio').innerHTML = lista.map(p => {
                const qtd = carrinho[p.id_produto] || 0;
                const imagem = p.imagem
                    ? `<img src="${esc(p.imagem)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=icone>${iconeProduto(p.categoria)}</div>'">`
                    : `<div class="icone">${iconeProduto(p.categoria)}</div>`;
                return `
                    <div class="produto ${qtd ? 'selecionado' : ''}">
                        ${imagem}
                        <h4>${esc(p.nome)}</h4>
                        <div class="preco">${moeda(p.preco)}</div>
                        <div class="contador">
                            <button aria-label="Remover" onclick="alterar(${p.id_produto}, -1)" ${qtd ? '' : 'disabled'}>−</button>
                            <span>${qtd}</span>
                            <button aria-label="Adicionar" onclick="alterar(${p.id_produto}, 1)">+</button>
                        </div>
                    </div>`;
            }).join('') || '<p class="suave">Nenhum produto nesta categoria.</p>';
        }

        function desenharResumo() {
            const itens = Object.entries(carrinho).map(([id, qtd]) => {
                const p = produtos.find(x => x.id_produto == id);
                return `<li><span><b>${qtd}x</b> ${esc(p.nome)}</span><span>${moeda(p.preco * qtd)}</span></li>`;
            });
            document.getElementById('itens-resumo').innerHTML = itens.join('') || '<li class="suave">Nenhum item ainda.</li>';
            document.getElementById('total').textContent = moeda(totalCarrinho());
            document.getElementById('btn-ir-pagamento').disabled = itens.length === 0;
        }

        function alterar(id, delta) {
            const nova = Math.min(50, Math.max(0, (carrinho[id] || 0) + delta));
            if (nova) carrinho[id] = nova; else delete carrinho[id];
            desenharCardapio();
            desenharResumo();
        }

        async function finalizar(botao) {
            const itens = Object.entries(carrinho).map(([id, quantidade]) => ({ id_produto: Number(id), quantidade }));
            await comBotao(botao, async () => {
                try {
                    const r = await api('pedidos.php', {
                        metodo: 'POST',
                        dados: { nome_cliente: nomeCliente(), forma_pagamento: formaPagamento, itens },
                    });
                    if (r.pix) {
                        await abrirPix(r.id_pedido);
                    } else {
                        exibirMensagem(`Pedido ${numeroPedido(r.id_pedido)} enviado para a cozinha!`, 'sucesso');
                        setTimeout(() => location.href = 'monitoramento.html', 1200);
                    }
                } catch (e) {
                    exibirMensagem(e.message, 'erro');
                }
            });
        }

        // ---------- Pix ----------

        async function abrirPix(idPedido) {
            const pix = await api('pix_criar.php', { metodo: 'POST', dados: { id_pedido: idPedido } });
            const fundo = document.createElement('div');
            fundo.className = 'modal-fundo';
            fundo.id = 'modal-pix';

            const conteudoPix = pix.demo
                ? `<div class="aviso-demo"><b><i class="fa-solid fa-flask"></i> Modo demonstração.</b>
                       O Mercado Pago ainda não foi configurado, então nenhuma cobrança real foi criada.
                       Use o botão abaixo para simular que o cliente pagou.</div>
                   <button class="btn btn-sucesso btn-bloco" onclick="simularPagamento(${idPedido}, this)">
                       <i class="fa-solid fa-circle-check"></i> Simular pagamento aprovado</button>`
                : `${pix.qr_code_base64 ? `<img class="qr-pix" src="data:image/png;base64,${pix.qr_code_base64}" alt="QR Code Pix">` : ''}
                   <div class="campo" style="text-align:left;margin-top:12px">
                       <label for="pix-copia-cola">Pix copia e cola</label>
                       <textarea id="pix-copia-cola" readonly>${esc(pix.copia_cola)}</textarea>
                   </div>
                   <div class="acoes" style="justify-content:center">
                       <button class="btn btn-secundario" onclick="copiarPix()"><i class="fa-regular fa-copy"></i> Copiar</button>
                       <button class="btn btn-primario" onclick="verificarPix(${idPedido}, true)"><i class="fa-solid fa-rotate"></i> Já paguei</button>
                   </div>`;

            fundo.innerHTML = `
                <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-pix">
                    <h2 id="titulo-pix"><i class="fa-solid fa-qrcode"></i> Pagamento via Pix</h2>
                    <p class="suave">Pedido <b>${numeroPedido(idPedido)}</b> · <b>${moeda(pix.valor_total)}</b></p>
                    ${conteudoPix}
                    <p id="status-pix" class="suave" style="margin:16px 0 8px"><i class="fa-solid fa-spinner fa-spin"></i> Aguardando pagamento...</p>
                    <button class="btn btn-perigo btn-pequeno" onclick="cancelarPix(${idPedido}, this)">Cancelar pedido</button>
                </div>`;
            document.body.appendChild(fundo);

            if (!pix.demo) consultaPix = setInterval(() => verificarPix(idPedido, false), 5000);
        }

        function copiarPix() {
            const campo = document.getElementById('pix-copia-cola');
            navigator.clipboard.writeText(campo.value)
                .then(() => exibirMensagem('Código Pix copiado!', 'sucesso'))
                .catch(() => { campo.select(); exibirMensagem('Selecione e copie o código manualmente.', 'alerta'); });
        }

        function pagamentoAprovado(idPedido) {
            clearInterval(consultaPix);
            document.getElementById('status-pix').innerHTML = '<span style="color:var(--verde);font-weight:700"><i class="fa-solid fa-circle-check"></i> Pagamento aprovado! Enviando para a cozinha...</span>';
            exibirMensagem(`Pix do pedido ${numeroPedido(idPedido)} aprovado!`, 'sucesso');
            setTimeout(() => location.href = 'monitoramento.html', 1500);
        }

        async function verificarPix(idPedido, avisar) {
            try {
                const r = await api('pix_consultar.php', { metodo: 'POST', dados: { id_pedido: idPedido } });
                if (r.pago) pagamentoAprovado(idPedido);
                else if (avisar) exibirMensagem('O pagamento ainda não foi confirmado.', 'alerta');
            } catch (e) {
                if (avisar) exibirMensagem(e.message, 'erro');
            }
        }

        async function simularPagamento(idPedido, botao) {
            await comBotao(botao, async () => {
                try {
                    await api('pix_consultar.php', { metodo: 'POST', dados: { id_pedido: idPedido, simular: true } });
                    pagamentoAprovado(idPedido);
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
        }

        async function cancelarPix(idPedido, botao) {
            if (!confirm('Cancelar este pedido? O Pix não deve ser pago depois disso.')) return;
            await comBotao(botao, async () => {
                try {
                    await api('pedidos.php', { metodo: 'PATCH', dados: { id_pedido: idPedido, status: 'Cancelado' } });
                    clearInterval(consultaPix);
                    document.getElementById('modal-pix').remove();
                    exibirMensagem(`Pedido ${numeroPedido(idPedido)} cancelado.`, 'alerta');
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
        }

        // ---------- Eventos ----------

        document.getElementById('form-cliente').addEventListener('submit', e => { e.preventDefault(); irPara(2); });

        document.getElementById('abas').addEventListener('click', e => {
            const aba = e.target.closest('.aba');
            if (!aba) return;
            categoria = aba.dataset.categoria;
            document.querySelectorAll('.aba').forEach(a => a.classList.toggle('ativa', a === aba));
            desenharCardapio();
        });

        document.getElementById('formas').addEventListener('click', e => {
            const botao = e.target.closest('.forma');
            if (!botao) return;
            formaPagamento = botao.dataset.forma;
            document.querySelectorAll('.forma').forEach(b => b.classList.toggle('selecionada', b === botao));
            document.getElementById('btn-finalizar').disabled = false;
        });

        iniciarPagina({ id: 'pedidos', titulo: 'Novo pedido' }).then(async () => {
            document.getElementById('nome-cliente').focus();
            try {
                produtos = (await api('produtos.php')).produtos;
                desenharCardapio();
                desenharResumo();
            } catch (e) {
                document.getElementById('cardapio').innerHTML = `<p class="suave">${esc(e.message)}</p>`;
            }
        }).catch(() => {});
    </script>
</body>
</html>
