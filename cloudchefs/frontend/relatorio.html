<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <div>
                <h2>Relatórios</h2>
                <p>Considera apenas pedidos pagos e não cancelados.</p>
            </div>
        </div>

        <section class="cartao nao-imprimir">
            <form id="filtros" class="linha-campos">
                <div class="campo">
                    <label for="tipo">Relatório</label>
                    <select id="tipo">
                        <option value="vendas">Vendas por dia</option>
                        <option value="produtos">Produtos mais vendidos</option>
                    </select>
                </div>
                <div class="campo"><label for="inicio">De</label><input type="date" id="inicio" required></div>
                <div class="campo"><label for="fim">Até</label><input type="date" id="fim" required></div>
                <div class="campo">
                    <div class="acoes">
                        <button type="submit" class="btn btn-primario" id="btn-consultar"><i class="fa-solid fa-chart-column"></i> Gerar</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="cartao oculto" id="resultado">
            <div class="cabecalho-pagina" style="margin-bottom:10px">
                <h3 id="titulo-relatorio" style="margin:0"></h3>
                <div class="acoes nao-imprimir">
                    <button class="btn btn-secundario btn-pequeno" onclick="exportarCSV(document.querySelector('#resultado table'), nomeArquivo())"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="btn btn-secundario btn-pequeno" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                </div>
            </div>
            <div id="grafico"></div>
            <div class="tabela-container" id="tabela"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        let ultimo = null;
        const nomeArquivo = () => `relatorio_${ultimo.tipo}_${ultimo.inicio}_a_${ultimo.fim}.csv`;
        const br = iso => iso.split('-').reverse().join('/');

        function grafico(rotulos, valores) {
            const maximo = Math.max(...valores, 1);
            return `<div class="grafico-barras" aria-hidden="true">${valores.map((v, i) => `
                <div class="coluna" title="${esc(rotulos[i])}: ${moeda(v)}">
                    <div style="height:${Math.max(1, v / maximo * 100)}%"></div><span>${esc(rotulos[i])}</span>
                </div>`).join('')}</div>`;
        }

        async function gerar() {
            const busca = {
                tipo: document.getElementById('tipo').value,
                inicio: document.getElementById('inicio').value,
                fim: document.getElementById('fim').value,
            };
            if (!busca.inicio || !busca.fim) { exibirMensagem('Informe as duas datas.', 'alerta'); return; }

            await comBotao(document.getElementById('btn-consultar'), async () => {
                try {
                    const r = await api(`relatorios.php?${new URLSearchParams(busca)}`);
                    ultimo = r;
                    const caixa = document.getElementById('resultado');
                    caixa.classList.remove('oculto');

                    if (r.tipo === 'vendas') {
                        const total = r.linhas.reduce((s, l) => s + l.valor_total, 0);
                        const pedidos = r.linhas.reduce((s, l) => s + l.pedidos, 0);
                        document.getElementById('titulo-relatorio').textContent = `Vendas de ${br(r.inicio)} a ${br(r.fim)}`;
                        document.getElementById('grafico').innerHTML = r.linhas.length
                            ? grafico(r.linhas.map(l => dataCurta(l.data)), r.linhas.map(l => l.valor_total)) : '';
                        document.getElementById('tabela').innerHTML = `
                            <table class="tabela">
                                <thead><tr><th>Data</th><th class="num">Pedidos</th><th class="num">Valor</th></tr></thead>
                                <tbody>${r.linhas.map(l => `<tr><td>${br(l.data)}</td><td class="num">${l.pedidos}</td><td class="num">${moeda(l.valor_total)}</td></tr>`).join('')
                                    || '<tr><td colspan="3" class="vazio">Nenhuma venda no período.</td></tr>'}</tbody>
                                <tfoot><tr><td>Total</td><td class="num">${pedidos}</td><td class="num">${moeda(total)}</td></tr></tfoot>
                            </table>`;
                    } else {
                        const total = r.linhas.reduce((s, l) => s + l.receita, 0);
                        const top = r.linhas.slice(0, 10);
                        document.getElementById('titulo-relatorio').textContent = `Produtos vendidos de ${br(r.inicio)} a ${br(r.fim)}`;
                        document.getElementById('grafico').innerHTML = top.length
                            ? grafico(top.map(l => l.nome_produto.split(' ').slice(0, 2).join(' ')), top.map(l => l.receita)) : '';
                        document.getElementById('tabela').innerHTML = `
                            <table class="tabela">
                                <thead><tr><th>Produto</th><th class="num">Quantidade</th><th class="num">Receita</th><th class="num">% da receita</th></tr></thead>
                                <tbody>${r.linhas.map(l => `<tr><td>${esc(l.nome_produto)}</td><td class="num">${l.quantidade}</td><td class="num">${moeda(l.receita)}</td>
                                    <td class="num">${total ? (l.receita / total * 100).toFixed(1).replace('.', ',') : 0}%</td></tr>`).join('')
                                    || '<tr><td colspan="4" class="vazio">Nenhum produto vendido no período.</td></tr>'}</tbody>
                                <tfoot><tr><td>Total</td><td class="num">${r.linhas.reduce((s, l) => s + l.quantidade, 0)}</td><td class="num">${moeda(total)}</td><td class="num">100%</td></tr></tfoot>
                            </table>`;
                    }
                } catch (e) { exibirMensagem(e.message, 'erro'); }
            });
        }

        document.getElementById('filtros').addEventListener('submit', e => { e.preventDefault(); gerar(); });

        iniciarPagina({ id: 'relatorios', titulo: 'Relatórios', somenteGerente: true }).then(() => {
            document.getElementById('inicio').value = hojeISO(-13);
            document.getElementById('fim').value = hojeISO();
            gerar();
        }).catch(() => {});
    </script>
</body>
</html>
