<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="tela-login">
        <form class="caixa-login" id="form-login" novalidate>
            <img src="img/logo.png" alt="Logo Cloud Chefs">
            <h1>Bem-vindo!</h1>
            <p>Entre com seu usuário para acessar o sistema.</p>

            <div class="campo">
                <label for="login">Usuário</label>
                <input type="text" id="login" autocomplete="username" autocapitalize="none" required autofocus>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primario btn-bloco btn-grande" id="btn-entrar">ENTRAR</button>
            <a href="esqueceusenha.html" class="link">Esqueceu a senha?</a>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        const destino = () => {
            const voltar = new URLSearchParams(location.search).get('voltar') || '';
            // Só aceita páginas do próprio sistema (evita redirecionar para outro site).
            return /^[a-z_]+\.html(\?[\w=&%-]*)?$/.test(voltar) ? voltar : 'monitoramento.html';
        };

        // Se já existe sessão válida, vai direto para o sistema.
        api('me.php').then(() => location.replace(destino())).catch(() => {});

        document.getElementById('form-login').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const login = document.getElementById('login').value.trim();
            const senha = document.getElementById('senha').value;
            if (!login || !senha) {
                exibirMensagem('Informe o usuário e a senha.', 'alerta');
                return;
            }
            await comBotao(document.getElementById('btn-entrar'), async () => {
                try {
                    await api('login.php', { metodo: 'POST', dados: { login, senha } });
                    location.replace(destino());
                } catch (e) {
                    exibirMensagem(e.message, 'erro');
                    document.getElementById('senha').select();
                }
            });
        });
    </script>
</body>
</html>
