<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chefs</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <div>
                <h2>Financeiro</h2>
                <p id="periodo-texto">Pedidos pagos no período.</p>
            </div>
            <div class="acoes nao-imprimir">
                <button class="btn btn-secundario" onclick="exportarCSV(document.getElementById('tabela'), 'financeiro.csv')"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <button class="btn btn-secundario" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            </div>
        </div>

        <section class="cartao nao-imprimir">
            <form id="filtros" class="linha-campos">
                <div class="campo">
                    <label for="forma">Forma de pagamento</label>
                    <select id="forma">
                        <option value="">Todas</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Debito">Débito</option>
                        <option value="Credito">Crédito</option>
                        <option value="PIX">Pix</option>
                    </select>
                </div>
                <div class="campo"><label for="inicio">De</label><input type="date" id="inicio"></div>
                <div class="campo"><label for="fim">Até</label><input type="date" id="fim"></div>
                <div class="campo">
                    <div class="acoes">
                        <button type="submit" class="btn btn-primario"><i class="fa-solid fa-magnifying-glass"></i> Consultar</button>
                        <button type="button" class="btn btn-secundario" onclick="limpar()">Limpar</button>
                    </div>
                </div>
            </form>
        </section>

        <div class="kpis">
            <div class="kpi destaque"><div class="rotulo">Total recebido</div><div class="valor" id="k-total">–</div></div>
            <div class="kpi"><div class="rotulo">Pedidos pagos</div><div class="valor" id="k-qtd">–</div></div>
            <div class="kpi"><div class="rotulo">Ticket médio</div><div class="valor" id="k-ticket">–</div></div>
            <div class="kpi"><div class="rotulo">Cancelados</div><div class="valor" id="k-cancelados">–</div></div>
        </div>

        <section class="cartao">
            <h3>Recebido por forma de pagamento</h3>
            <div id="por-forma" class="kpis" style="margin-bottom:0"></div>
        </section>

        <section class="cartao">
            <div class="tabela-container">
                <table class="tabela" id="tabela">
                    <thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Situação</th><th class="num">Total</th></tr></thead>
                    <tbody id="lista"><tr><td colspan="6" class="carregando">Carregando...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        function badgeStatus(p) {
            if (p.status === 'Cancelado') return '<span class="badge badge-perigo">Cancelado</span>';
            if (p.status_pagamento !== 'aprovado') return '<span class="badge badge-alerta">Não pago</span>';
            return '<span class="badge badge-ok">Pago</span>';
        }

        async function consultar() {
            const forma = document.getElementById('forma').value;
            const inicio = document.getElementById('inicio').value;
            const fim = document.getElementById('fim').value;
            const busca = new URLSearchParams({ forma, inicio, fim });
            const corpo = document.getElementById('lista');
            corpo.innerHTML = '<tr><td colspan="6" class="carregando">Carregando...</td></tr>';

            try {
                const { pedidos, resumo } = await api(`financeiro.php?${busca}`);
                document.getElementById('k-total').textContent = moeda(resumo.total);
                document.getElementById('k-qtd').textContent = resumo.quantidade;
                document.getElementById('k-ticket').textContent = moeda(resumo.ticket_medio);
                document.getElementById('k-cancelados').textContent = resumo.cancelados;
                document.getElementById('periodo-texto').textContent =
                    `Período: ${inicio ? inicio.split('-').reverse().join('/') : 'início'} a ${fim ? fim.split('-').reverse().join('/') : 'hoje'}` +
                    (forma ? ` · ${NOMES_PAGAMENTO[forma]}` : '');

                document.getElementById('por-forma').innerHTML = Object.keys(NOMES_PAGAMENTO).map(f => `
                    <div class="kpi"><div class="rotulo">${NOMES_PAGAMENTO[f]}</div><div class="valor" style="font-size:1.2rem">${moeda(resumo.por_forma[f] || 0)}</div></div>`).join('');

                corpo.innerHTML = pedidos.map(p => `
                    <tr>
                        <td>${numeroPedido(p.id_pedido)}</td>
                        <td>${dataHora(p.data_pedido)}</td>
                        <td>${esc(p.nome_cliente)}</td>
                        <td>${NOMES_PAGAMENTO[p.forma_pagamento] || esc(p.forma_pagamento)}</td>
                        <td>${badgeStatus(p)}</td>
                        <td class="num">${moeda(p.valor_total)}</td>
                    </tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum pedido no período.</td></tr>';
            } catch (e) {
                corpo.innerHTML = `<tr><td colspan="6" class="vazio">${esc(e.message)}</td></tr>`;
                exibirMensagem(e.message, 'erro');
            }
        }

        function limpar() {
            document.getElementById('forma').value = '';
            document.getElementById('inicio').value = hojeISO(-29);
            document.getElementById('fim').value = hojeISO();
            consultar();
        }

        document.getElementById('filtros').addEventListener('submit', e => { e.preventDefault(); consultar(); });

        iniciarPagina({ id: 'financeiro', titulo: 'Financeiro', somenteGerente: true }).then(limpar).catch(() => {});
    </script>
</body>
</html>
